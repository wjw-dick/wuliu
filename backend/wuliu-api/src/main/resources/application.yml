server:
  port: 8080
  tomcat:
    max-threads: 200
    connection-timeout: 30s

spring:
  application:
    name: wuliu-saas
  datasource:
    url: jdbc:h2:mem:wuliu;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 80MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  seed:
    enabled: true
  jwt:
    secret: ${APP_JWT_SECRET:wl-demo-jwt-secret-please-change-in-prod-2026}
    ttl-hours: 12
  cache:
    type: ${APP_CACHE_TYPE:memory}

logging:
  level:
    com.quantaida.wuliu: info
    org.springframework.jdbc: warn

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
